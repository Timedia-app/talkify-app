name: Export chiffré (bilan)
on: { push: { branches: [data-export] } }
permissions: { contents: write }
jobs:
  export:
    if: "!contains(github.event.head_commit.message, '[result]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd scripts && npm install --no-audit --no-fund
      - run: node scripts/export.mjs
        env: { FIREBASE_SERVICE_ACCOUNT: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
      - name: Chiffrer et publier
        run: |
          openssl rand -hex 32 > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/data.json -out data.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey export-pub.pem -in /tmp/k -out data.key
          rm /tmp/k /tmp/data.json
          git config user.name "export-bot"; git config user.email "bot@users.noreply.github.com"
          git add data.enc data.key && git commit -m "[result] export" && git push
