name: Construire l'APK Android
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci || npm install
      - run: npm run android
      - name: google-services.json (notifications)
        env: { GSJ: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: if [ -n "$GSJ" ]; then echo "$GSJ" > android/app/google-services.json; fi
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Talkify.apk
      - uses: actions/upload-artifact@v4
        with: { name: Talkify-APK, path: Talkify.apk }
      - name: Publier l'APK (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Talkify — dernière version
          files: Talkify.apk
          make_latest: true
