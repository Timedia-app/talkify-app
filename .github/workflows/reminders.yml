name: Rappels du matin Talkify
on:
  schedule:
    - cron: "0 8 * * *"    # matin : rappels du jour
    - cron: "0 20 * * *"   # soir : rapport du jour
  workflow_dispatch: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd scripts && npm install --no-audit --no-fund
      - run: node scripts/daily-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
          MODE: ${{ github.event.schedule == '0 20 * * *' && 'evening' || 'morning' }}
